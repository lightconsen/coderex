[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    # wasmtime/Cranelift use this SPDX expression: still a permissive
    # Apache-2.0 grant, with the LLVM runtime exception.
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # Unicode data license, used by text-shaping crates.
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    # terminfo 0.9 is WTFPL: a permissive, condition-free license.
    "WTFPL",
    # Boost Software License (dragonbox, through oxc float formatting).
    "BSL-1.0",
    # Data/notice-only: CC0 for `notify`, CDLA-Permissive-2.0 for the
    # `webpki-roots` certificate bundle.
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    # `nucleo-matcher` is MPL-2.0 (file-level weak copyleft), used
    # unmodified. Accepted by decision on 2026-10-28; the obligation is to
    # publish modifications to MPL-covered files, and there are none.
    "MPL-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace members are referenced by path only; cargo-deny counts a path-only
# dependency as a wildcard. They are not registry wildcards.
allow-wildcard-paths = true
deny = [
    # No GPL/AGPL. MPL-2.0 is allowed above for nucleo-matcher only; it is a
    # file-level copyleft and the dependency is unmodified.
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# Keep in sync with .cargo/audit.toml. Each entry is a reviewed,
# informational advisory with no usable patched dependency; see that file for
# the reasoning behind each one.
ignore = [
    "RUSTSEC-2024-0320", # yaml-rust: optional syntect feature, not enabled
    "RUSTSEC-2025-0141", # bincode: syntect dump format, unmaintained
    "RUSTSEC-2026-0370", # zvariant: zbus 5 stack, no patched version
    "RUSTSEC-2026-0371", # zbus_names: zbus 5 stack, no patched version
    "RUSTSEC-2026-0372", # zvariant_derive: zbus 5 stack, no patched version
]
