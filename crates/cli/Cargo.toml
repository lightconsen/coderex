[package]
name = "coderex-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI binary — startup orchestrator, REPL loop, CLI subcommands"

[lints]
workspace = true

[[bin]]
name = "coderex"
path = "src/main.rs"

[[bin]]
name = "mock-anthropic-server"
path = "src/bin/mock_anthropic_server.rs"

[dependencies]
coderex-core = { path = "../core" }
coderex-tools = { path = "../tools" }
coderex-agents = { path = "../agents" }
coderex-commands = { path = "../commands" }
coderex-hooks = { path = "../hooks" }
coderex-memory = { path = "../memory" }
coderex-mcp = { path = "../mcp" }
coderex-plugins = { path = "../plugins" }
coderex-bridge = { path = "../bridge" }
coderex-server = { path = "../server" }
coderex-ui = { path = "../ui" }
coderex-sdk = { path = "../sdk" }
coderex-config = { path = "../config" }
notify = { version = "7", optional = true }
coderex-telemetry = { path = "../telemetry" }

clap.workspace = true
tokio.workspace = true
tokio-util = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
home.workspace = true
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
reqwest.workspace = true
async-trait.workspace = true
crossterm.workspace = true
compact_str.workspace = true
uuid.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
compact_str.workspace = true
ratatui.workspace = true
crossterm.workspace = true
serde_json.workspace = true
coderex-test-utils = { path = "../test-utils" }

# ─── Release Tier Features ──────────────────────────────────────────────────
# Each tier enables everything below it.
#
#   cargo build --features core          # QueryEngine + baseline tools
#   cargo build --features full          # core + bridge/server/plugins
#   cargo build --features enterprise    # full + managed settings/team/trusted device
#

[features]
default = ["core"]
core = []
full = ["core"]
hot-reload = ["coderex-config/hot-reload", "dep:notify"]
enterprise = ["full", "coderex-config/enterprise"]

[package.metadata.dist]
# The name cargo-dist uses for this binary
name = "coderex"
# Whether to build this package in releases
dist = true
# The hosts to build for (inherits from workspace by default)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
