[package]
name = "coderex-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP server lifecycle, tool discovery, resources, OAuth, elicitation"

[lints]
workspace = true

[dependencies]
coderex-core = { path = "../core" }
coderex-tools = { path = "../tools" }

thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
# `preserve_order` keeps `requestedSchema.properties` in the order the server
# declared them, which is the order the elicitation questions are asked in.
serde_json = { workspace = true, features = ["preserve_order"] }
dashmap.workspace = true
tokio-tungstenite.workspace = true
oauth2.workspace = true
reqwest.workspace = true
url.workspace = true
chrono.workspace = true
async-trait.workspace = true

[dev-dependencies]
tempfile.workspace = true
