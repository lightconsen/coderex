[package]
name = "coderex-core"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core types, QueryEngine, state machines, and shared traits for CodeRex"

[lints]
workspace = true

[features]
default = []
test-utils = ["dep:wiremock"]

[dependencies]
# The Linux sandbox reaches libc directly (seccomp, prlimit). It was declared in
# the workspace and never listed here, so `coderex-core` did not build on Linux
# at all — the sandbox code was reviewed but never compiled on the platform it
# exists for.
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
parking_lot.workspace = true
dashmap.workspace = true
derive_builder.workspace = true
futures.workspace = true
strum.workspace = true
bitflags.workspace = true
reqwest.workspace = true
bytes.workspace = true
async-trait.workspace = true
globset.workspace = true
ignore.workspace = true
walkdir.workspace = true
nucleo-matcher.workspace = true
comrak.workspace = true
syntect.workspace = true
cron.workspace = true
sha2.workspace = true
hmac.workspace = true
async-stream.workspace = true
toml.workspace = true

# Optional
wiremock = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }

# The Windows sandbox needs Win32 directly: AppContainer profiles, DACL
# editing, process attributes and Job Objects. Declaring it only in the code
# left `coderex-core` unable to build for Windows at all.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[dev-dependencies]
mockall.workspace = true
proptest.workspace = true
tempfile.workspace = true
