[package]
name = "coderex-config"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Configuration system — settings loading, feature flags, capability sets, remote managed settings"

[lints]
workspace = true

[features]
default = []
enterprise = []
# `keyring` pulls in the platform backend as well as the crate: without one of
# these, keyring-rs silently falls back to its in-memory mock store, which
# would look like a successful save and lose the credential at process exit.
# keyring 4 selects its platform stores through the `v1` default feature:
# Apple Keychain, Windows Credential Manager and the freedesktop Secret
# Service (zbus 5). There is no longer a mock fallback to enable by accident.
keyring = ["dep:keyring"]

[dependencies]
coderex-core = { path = "../core" }

thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
reqwest.workspace = true
sha2.workspace = true
home.workspace = true
once_cell.workspace = true
bitflags.workspace = true
async-trait.workspace = true
chrono.workspace = true
keyring = { version = "4", optional = true }
plist = "1.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# Real DACL construction for the private token-file fallback. `std` has no ACL
# API, and `icacls` is neither atomic nor locale-stable.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
tokio.workspace = true
proptest.workspace = true
