[package]
name = "coderex-config"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Configuration system — settings loading, feature flags, capability sets, remote managed settings"

[lints]
workspace = true

[features]
default = []
enterprise = []
# `keyring` pulls in the platform backend as well as the crate: without one of
# these, keyring-rs silently falls back to its in-memory mock store, which
# would look like a successful save and lose the credential at process exit.
keyring = [
    "dep:keyring",
    "keyring/apple-native",
    "keyring/windows-native",
    "keyring/linux-native-sync-persistent",
    "keyring/crypto-rust",
]
hot-reload = ["dep:notify"]

[dependencies]
coderex-core = { path = "../core" }

thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
reqwest.workspace = true
sha2.workspace = true
home.workspace = true
once_cell.workspace = true
bitflags.workspace = true
async-trait.workspace = true
chrono.workspace = true
keyring = { version = "3", optional = true }
notify = { version = "7", optional = true }

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
tokio.workspace = true
