[package]
name = "coderex-plugins"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Plugin loader, skill system, and marketplace reconciliation"

[lints]
workspace = true

[dependencies]
coderex-core = { path = "../core" }
coderex-commands = { path = "../commands" }

thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
dashmap.workspace = true
home.workspace = true
reqwest.workspace = true
hex.workspace = true
url.workspace = true
tar.workspace = true
flate2.workspace = true
yaml-rust2 = "0.13"
semver.workspace = true
ed25519-dalek.workspace = true
async-trait.workspace = true
tempfile.workspace = true
sha2.workspace = true
hmac.workspace = true
rand_core.workspace = true
wasmparser = { version = "0.202", optional = true }
wat = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
default = ["process-runtime", "wasm-runtime"]
process-runtime = []
wasm-runtime = ["dep:wasmtime", "dep:wasmparser", "dep:wat"]

[dependencies.wasmtime]
version = "50.0.0"
optional = true

[[bin]]
name = "coderex-wasm-compile"
path = "src/bin/coderex-wasm-compile.rs"
required-features = ["wasm-runtime"]

[dev-dependencies]
tempfile.workspace = true
