[package]
name = "coderex-memory"
version = "0.1.1"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Memory system — JSONL transcripts, SQLite index, long-term memory, team sync, auto dream"

[lints]
workspace = true

[dependencies]
coderex-core = { path = "../core" }

async-trait.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
uuid.workspace = true
chrono.workspace = true
regex.workspace = true
pathdiff.workspace = true
home.workspace = true
sha2.workspace = true
parking_lot.workspace = true
dashmap.workspace = true
once_cell.workspace = true
flate2 = "1"

# Optional: transcript encryption
aes-gcm = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }

# Optional: team HTTP transport
reqwest = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
futures.workspace = true
wiremock.workspace = true

[features]
encryption = ["dep:aes-gcm", "dep:hkdf", "dep:hex", "dep:rand_core"]
team-http = ["dep:reqwest"]
