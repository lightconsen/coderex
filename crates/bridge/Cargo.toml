[package]
name = "coderex-bridge"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bridge remote session system — work poller, spawner, permission router, archive"

[lints]
workspace = true

[dependencies]
coderex-core = { path = "../core" }

thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
reqwest.workspace = true
strum.workspace = true
uuid.workspace = true
chrono.workspace = true
home.workspace = true
sha2.workspace = true
base64.workspace = true
rand = "0.10"

# `openssh` is Unix-only (it reaches `std::os::unix`), so the SSH spawn path
# is compiled only there. The Windows build refuses `SpawnMode::Ssh` with a
# clear error instead of failing to compile the workspace.
[target.'cfg(unix)'.dependencies]
openssh.workspace = true

[dev-dependencies]
tempfile.workspace = true
coderex-server = { path = "../server" }
