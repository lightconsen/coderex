[package]
name = "coderex-evals"
version = "0.1.2"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Evaluation for CodeRex — in-process scenario evals, and the hill-climb loop"

[lints]
