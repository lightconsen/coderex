[package]
name = "coderex-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.coderex-core]
path = "../crates/core"

[dependencies.coderex-config]
path = "../crates/config"

[dependencies.coderex-plugins]
path = "../crates/plugins"

[[bin]]
name = "fuzz_sse_stream"
path = "fuzz_targets/fuzz_sse_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_wire_protocol"
path = "fuzz_targets/fuzz_wire_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_settings_json"
path = "fuzz_targets/fuzz_settings_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_plugin_manifest"
path = "fuzz_targets/fuzz_plugin_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_shell_ast"
path = "fuzz_targets/fuzz_shell_ast.rs"
test = false
doc = false
bench = false
