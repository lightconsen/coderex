name: Linux build dependencies
description: >-
  System libraries the workspace needs before cargo can build it: dbus for
  keyring (libdbus-sys) and lld for the linker configured in
  .cargo/config.toml.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y lld libdbus-1-dev pkg-config
    - name: Free disk space
      shell: bash
      run: |
        # The workspace test build (wasmtime + fixtures) fills the hosted
        # runner's root disk. These preinstalled toolchains are unused here.
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost
        sudo docker image prune -af || true
