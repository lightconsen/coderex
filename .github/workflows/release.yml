name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  # Build and upload release artifacts for all platforms
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --package coderex-cli --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/coderex dist/coderex-${{ matrix.target }}
          tar czvf coderex-${{ matrix.target }}.tar.gz -C dist coderex-${{ matrix.target }}

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/coderex.exe dist/coderex-${{ matrix.target }}.exe
          Compress-Archive -Path dist/coderex-${{ matrix.target }}.exe -DestinationPath coderex-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: coderex-${{ matrix.target }}
          path: |
            coderex-*.tar.gz
            coderex-*.zip

  # Smoke the artifacts before they are published: a release whose tarball
  # unpacks to a binary that does not run is worse than a failed build.
  smoke:
    name: Smoke the artifacts
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: The Linux binaries run
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu x86_64-unknown-linux-musl; do
            archive="artifacts/coderex-${target}.tar.gz"
            test -f "$archive"
            tar tzf "$archive" | grep -qx "coderex-${target}"
            mkdir -p "unpacked/${target}"
            tar xzf "$archive" -C "unpacked/${target}"
            "unpacked/${target}/coderex-${target}" --version
          done

      - name: Every archive contains its binary
        run: python3 scripts/check-release-archives.py artifacts

  # Create the GitHub Release and attach all artifacts
  release:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
