name: Release

on:
  push:
    tags:
      # GitHub matches these with minimatch, where `+` is a literal character
      # (only `+(...)` is a quantifier). `v[0-9]+.*` therefore matches nothing
      # and no tag would ever start a release; `*` is the quantifier here.
      - 'v[0-9]*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  # Build and upload release artifacts for all platforms
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual dispatch names a tag in its input; without this the build
          # would package the default branch and publish it under that tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --package coderex-cli --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/coderex dist/coderex-${{ matrix.target }}
          tar czvf coderex-${{ matrix.target }}.tar.gz -C dist coderex-${{ matrix.target }}

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/coderex.exe dist/coderex-${{ matrix.target }}.exe
          Compress-Archive -Path dist/coderex-${{ matrix.target }}.exe -DestinationPath coderex-${{ matrix.target }}.zip
          # The zip is for people installing by hand; `coderex update` downloads
          # the bare executable so it does not need a zip decoder.
          Copy-Item dist/coderex-${{ matrix.target }}.exe coderex-${{ matrix.target }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: coderex-${{ matrix.target }}
          path: |
            coderex-*.tar.gz
            coderex-*.zip
            coderex-*.exe

  # One `SHA256SUMS` for the whole release: `install.sh`, `coderex update`
  # and anyone running `sha256sum -c` all check the same file.
  checksums:
    name: Publish checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          # Every target in the matrix must be here, with the name the
          # updater and install.sh look for. A matrix entry that silently
          # produced nothing would otherwise publish a release that is missing
          # a platform.
          for target in x86_64-unknown-linux-gnu x86_64-unknown-linux-musl \
                        x86_64-apple-darwin aarch64-apple-darwin \
                        x86_64-pc-windows-msvc; do
            if [[ "$target" == *windows* ]]; then
              test -f "coderex-${target}.zip"
              test -f "coderex-${target}.exe"
            else
              test -f "coderex-${target}.tar.gz"
            fi
          done
          sha256sum coderex-*.tar.gz coderex-*.zip coderex-*.exe | LC_ALL=C sort -k2 > SHA256SUMS
          cat SHA256SUMS
          sha256sum --check SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: artifacts/SHA256SUMS

  # Smoke the artifacts before they are published: a release whose tarball
  # unpacks to a binary that does not run is worse than a failed build.
  smoke:
    name: Smoke the artifacts
    needs: [build, checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `check-release-archives.py` lives in the repository; without a
      # checkout the step that runs it fails and no release is published.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: The Linux binaries run
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu x86_64-unknown-linux-musl; do
            archive="artifacts/coderex-${target}.tar.gz"
            test -f "$archive"
            tar tzf "$archive" | grep -qx "coderex-${target}"
            mkdir -p "unpacked/${target}"
            tar xzf "$archive" -C "unpacked/${target}"
            "unpacked/${target}/coderex-${target}" --version
          done

      - name: Every archive contains its binary
        run: python3 scripts/check-release-archives.py artifacts

      - name: Every artifact matches SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum --check --strict SHA256SUMS

  # Create the GitHub Release and attach all artifacts
  release:
    needs: [build, smoke, checksums]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve the release tag
        id: tag
        run: |
          # The action defaults to `github.ref`, which on a manual dispatch is
          # the branch (`refs/heads/main`) — it would publish under a tag called
          # `main`. Resolve it once so the release and its prerelease flag
          # cannot disagree.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "name=${tag}" >> "$GITHUB_OUTPUT"
          case "$tag" in
            *alpha*|*beta*|*rc*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
