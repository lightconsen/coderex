[workspace]
members = [
    "crates/core",
    "crates/tools",
    "crates/agents",
    "crates/artifacts",
    "crates/insights",
    "crates/workflow",
    "crates/commands",
    "crates/hooks",
    "crates/memory",
    "crates/mcp",
    "crates/mods",
    "crates/plugins",
    "crates/bridge",
    "crates/server",
    "crates/ui",
    "crates/events",
    "crates/config",
    "crates/telemetry",
    "crates/cli",
    "crates/test-utils",
    "evals",
]
resolver = "2"

# ─── Shared Dependencies ─────────────────────────────────────────────────────

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
pin-project = "1"
async-stream = "0.3"

# JavaScript engines — `boa_engine` for in-process workflow scripts and
# `rquickjs` for extension hooks (it exposes heap, stack and interrupt limits).
boa_engine = "0.22"
rquickjs = "0.14"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# HTTP & networking
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
url = "2"
http = "1"
bytes = "1"

# Terminal UI
ratatui = "0.30"
crossterm = "0.29"
unicode-segmentation = "1"
unicode-width = "0.2"

# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# Logging & observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
metrics = "0.24"

# Database
rusqlite = { version = "0.41", features = ["bundled"] }

# JSON Schema
jsonschema = "0.28"

# File operations
ignore = "0.4"
walkdir = "2"
globset = "0.4"
pathdiff = "0.2"
home = "0.5"
tempfile = "3"
tar = "0.4"
flate2 = "1"

# YAML parsing

# Semantic versioning
semver = "1"

# Cryptography — signatures
ed25519-dalek = "2"

# Text processing
nucleo-matcher = "0.3"
comrak = "0.37"
# `yaml-load`/`plist-load` are intentionally off: they pull the unmaintained
# `yaml-rust`, and the code only uses the compiled default syntax/theme sets.
syntect = { version = "5", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "default-themes",
    "regex-onig",
] }
compact_str = "0.9"
smallvec = "1"
regex = "1"
base64 = "0.22"

# Cryptography & hashing
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
hkdf = "0.12"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# OAuth2
oauth2 = "5"

# Utilities
strum = { version = "0.27", features = ["derive"] }
derive_builder = "0.20"
parking_lot = "0.12"
dashmap = "6"
moka = { version = "0.12", features = ["future"] }
once_cell = "1"
arc-swap = "1"
bitflags = "2"

# Cron
cron = "0.15"

# SSH
openssh = { version = "0.11", features = ["process-mux"] }

# LSP protocol types
lsp-types = "0.97"

# Platform-specific
libc = "0.2"

# Testing
mockall = "0.13"
wiremock = "0.6"
proptest = "1"
assert_cmd = "2"
predicates = "3"
insta = "1.42"

# ─── Workspace Lints ─────────────────────────────────────────────────────────

[workspace.lints.rust]
unsafe_code = "deny"
unused = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Too noisy for library code
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
doc_markdown = "allow"
# The suggested rewrites below are worse than the code they replace, or the
# lint needs a judgement the compiler cannot make. Each is allowed with the
# reason it is not being chased.
#
# `assert!(x.is_empty())` is idiomatic; this lint's fix is `assert_eq!(x,
# [] as [T; 0])`, which reads worse than the assertion it replaces.
assert_is_empty = "allow"
# A nursery heuristic about how long a guard lives. Where it fires here the
# scope is deliberate (a lock held across a parse); shrinking it changes what
# the code guarantees.
significant_drop_tightening = "allow"
# Every occurrence is in a test that serializes on a std mutex across `.await`
# on purpose, so concurrent tests cannot interleave environment access.
await_holding_lock = "allow"
# `map_or_else` is not clearer than an `if let`/`else` when the else branch is
# several lines; the call sites use it that way.
option_if_let_else = "allow"
# These conversions are display-only (theme colours, byte counts), where a
# narrowing cast is intended and cannot overflow the rendered range.
cast_possible_truncation = "allow"
# Callback and trait-object types that a type alias would only rename.
type_complexity = "allow"
# Taking an owned value keeps the public signature stable for callers that
# build it inline; the lint would push `&()`-style borrows into the API.
needless_pass_by_value = "allow"

# ─── Release Features ────────────────────────────────────────────────────────

# ─── Release Tiers ───────────────────────────────────────────────────────────
#
# Feature flags control which subsystems are compiled into the binary.
#
#   cargo build --features release-tier=core      # QueryEngine + baseline tools
#   cargo build --features release-tier=full      # core + bridge/server/plugins
#   cargo build --features release-tier=enterprise # full + managed settings/team
#

[workspace.metadata.release]
pre-release-commit-message = "chore: release v{{version}}"
tag-message = "v{{version}}"

# ─── Release Profile ─────────────────────────────────────────────────────────

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.build-override]
opt-level = 3

# ─── Workspace Binary ────────────────────────────────────────────────────────

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/lightconsen/coderex"
