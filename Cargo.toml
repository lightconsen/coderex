[workspace]
members = [
    "crates/coderex-core",
    "crates/coderex-tools",
    "crates/coderex-agents",
    "crates/coderex-commands",
    "crates/coderex-hooks",
    "crates/coderex-memory",
    "crates/coderex-mcp",
    "crates/coderex-plugins",
    "crates/coderex-bridge",
    "crates/coderex-server",
    "crates/coderex-ui",
    "crates/coderex-sdk",
    "crates/coderex-config",
    "crates/coderex-cli",
]
resolver = "2"

# ─── Shared Dependencies ─────────────────────────────────────────────────────

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-tungstenite = "0.26"
futures = "0.3"
async-trait = "0.1"
pin-project = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# HTTP & networking
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
url = "2"
http = "1"
bytes = "1"

# Terminal UI
ratatui = "0.29"
crossterm = "0.28"
unicode-segmentation = "1"
unicode-width = "0.2"

# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# Logging & observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
metrics = "0.24"

# Database
rusqlite = { version = "0.34", features = ["bundled"] }

# JSON Schema
jsonschema = "0.28"

# File operations
ignore = "0.4"
walkdir = "2"
globset = "0.4"
pathdiff = "0.2"
home = "0.5"
tempfile = "3"

# Text processing
nucleo-matcher = "0.3"
comrak = "0.37"
syntect = "5"
compact_str = "0.9"
smallvec = "1"
regex = "1"
base64 = "0.22"

# Cryptography & hashing
sha2 = "0.10"
hmac = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# OAuth2
oauth2 = "5"

# Utilities
strum = { version = "0.27", features = ["derive"] }
derive_builder = "0.20"
parking_lot = "0.12"
dashmap = "6"
once_cell = "1"
arc-swap = "1"
bitflags = "2"

# Cron
cron = "0.15"

# LSP protocol types
lsp-types = "0.97"

# Platform-specific
libc = "0.2"

# Testing
mockall = "0.13"
wiremock = "0.6"
proptest = "1"
assert_cmd = "2"
predicates = "3"

# ─── Workspace Lints ─────────────────────────────────────────────────────────

[workspace.lints.rust]
unsafe_code = "deny"
unused = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Too noisy for library code
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
doc_markdown = "allow"

# ─── Release Features ────────────────────────────────────────────────────────

# ─── Release Tiers ───────────────────────────────────────────────────────────
#
# Feature flags control which subsystems are compiled into the binary.
#
#   cargo build --features release-tier=core      # QueryEngine + baseline tools
#   cargo build --features release-tier=full      # core + bridge/server/plugins
#   cargo build --features release-tier=enterprise # full + managed settings/team
#

[workspace.metadata.release]
pre-release-commit-message = "chore: release v{{version}}"
tag-message = "v{{version}}"

# ─── Workspace Binary ────────────────────────────────────────────────────────

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/coderex/coderex"
